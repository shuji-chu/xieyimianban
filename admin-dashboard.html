<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061329"><title>SOSKS5 · Admin Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#061329;--panel:rgba(10,29,58,.82);--line:#1e416d;--text:#e5f2ff;--muted:#8ca9ce;--cyan:#5de1ff;--blue:#398bff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#123d72 0,transparent 42%),linear-gradient(145deg,#050b19,#071a35 55%,#030914);font:14px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--text);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.space{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 50% 40%,#0d2d58aa,transparent 60%)}.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 20%,#fff 55%,transparent 70%),radial-gradient(1px 1px at 70% 12%,#b9e7ff 55%,transparent 70%),radial-gradient(2px 2px at 84% 62%,#fff 55%,transparent 70%),radial-gradient(1px 1px at 32% 78%,#b9e7ff 55%,transparent 70%);background-size:290px 250px;animation:stars 28s linear infinite}.planet{position:absolute;width:100px;height:100px;left:10%;top:14%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#8ee8ff,#2879db 38%,#10275e 75%);box-shadow:inset -14px -10px 24px #020c2c,0 0 48px #288dff55;animation:float 8s ease-in-out infinite}.orbit{position:absolute;left:50%;top:37%;width:min(70vw,700px);height:240px;border:1px solid #3db8ff70;border-radius:50%;transform:translate(-50%,-50%) rotate(-24deg)}.astronaut{position:absolute;width:clamp(130px,19vw,230px);right:7%;top:8%;filter:drop-shadow(0 15px 35px #168bff55);animation:float 5s ease-in-out infinite}.wrap{max-width:1450px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 22px;border-bottom:1px solid #1e416d88}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#4bc3ff,#2765e9);box-shadow:0 0 28px #368cff44}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.2em;margin-top:3px}.pill{border:1px solid #285583;background:#0a2444;color:#7de8ce;border-radius:30px;padding:8px 12px;font-size:11px}.layout{display:grid;grid-template-columns:220px 1fr;gap:22px;margin-top:22px}.side,.card,.login-card{background:var(--panel);border:1px solid #23456b;border-radius:18px;backdrop-filter:blur(18px);box-shadow:0 20px 65px #0003}.side{padding:16px;height:max-content;position:sticky;top:16px}.side-label{font-size:10px;color:#6f91bb;letter-spacing:.18em;padding:12px}.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#91acd0;text-align:left;padding:13px 12px;border-radius:11px;margin:3px 0}.nav.active,.nav:hover{background:#10345d;color:#76dfff}.main{min-width:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 20px}.heading h1{font-size:25px;margin:0;letter-spacing:-.04em}.heading p{color:var(--muted);font-size:12px;margin:7px 0 0}.btn{border:1px solid #2d5a8a;background:#102f59;color:#9edbff;border-radius:10px;padding:10px 14px}.btn.primary{background:linear-gradient(110deg,#2389ee,#315eea);border:0;color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{padding:18px;min-width:0}.metric-label{color:#91acd0;font-size:11px}.metric{font-size:28px;font-weight:800;margin:13px 0 6px;letter-spacing:-.04em}.note{color:#6e91bb;font-size:10px}.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.card h3{font-size:13px;margin:0 0 18px}.bars{display:grid;gap:17px}.barlabel{display:flex;justify-content:space-between;color:#a5bfdf;font-size:11px;margin-bottom:8px}.bar{height:7px;background:#102a4b;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#46bfff,#3975ff);border-radius:20px}.tablewrap{overflow:auto}.tablecard{padding:0;margin-top:14px}.tablehead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.tablehead h3{margin:0}table{border-collapse:collapse;width:100%;min-width:580px}th,td{text-align:left;padding:15px 18px;border-bottom:1px solid #1b3658;font-size:11px}th{color:#7899c2;background:#091e3a}td{color:#b0c7e5}.status{padding:5px 8px;border-radius:20px;color:#73e8c7;background:#103b3b;font-size:10px}.status.warn{color:#ffd27a;background:#48351a}.hidden{display:none!important}.login{min-height:75vh;display:grid;place-items:center}.login-card{width:min(100%,430px);padding:32px}.login-card h1{margin:0 0 8px}.login-card p{color:var(--muted);line-height:1.7}.field{display:block;margin:18px 0}.field span{display:block;color:#aac6e7;margin-bottom:8px;font-size:12px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #294b73;background:#06172e;color:white;outline:none}.field input:focus{border-color:var(--cyan)}.login-card .btn{width:100%;margin-top:6px}.hint{font-size:11px;color:#8ca9ce;margin-top:15px}.empty{padding:34px 12px;text-align:center;color:#8ca9ce}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#123761;border:1px solid #3573a9;border-radius:12px;display:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-13px) rotate(3deg)}}@keyframes stars{to{background-position:290px 250px,-190px 160px,130px -200px,250px 180px}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:70px 1fr}.side{padding:10px}.nav{justify-content:center;font-size:0}.nav span{font-size:17px}.side-label{display:none}.cols{grid-template-columns:1fr}.astronaut{opacity:.5;right:2%}}
@media(max-width:560px){.wrap{padding:14px}.layout{grid-template-columns:1fr;gap:12px}.side{position:static;display:flex;overflow:auto;gap:4px}.nav{flex:1;min-width:42px;padding:12px 8px}.grid{gap:8px}.card{padding:13px}.metric{font-size:22px}.heading h1{font-size:21px}.astronaut{width:100px;top:10%;right:4%;opacity:.35}.orbit{width:95vw;height:150px}.login-card{padding:24px}.top{padding-bottom:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style></head>
<body>
<div class="space"><div class="stars"></div><div class="planet"></div><div class="orbit"></div><div class="astronaut" aria-hidden="true"><svg viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#91b8e9"/></linearGradient><linearGradient id="visor"><stop stop-color="#174d8b"/><stop offset="1" stop-color="#07152f"/></linearGradient></defs><ellipse cx="110" cy="225" rx="60" ry="10" fill="#248aff" opacity=".2"/><path d="M73 136Q47 142 40 177L28 200Q27 211 39 212L55 184 76 167M147 136Q173 142 180 177L192 200Q193 211 181 212L165 184 144 167" fill="url(#suit)" stroke="#9edbff" stroke-width="3"/><path d="M75 126Q55 141 61 181L71 216Q110 237 149 216L159 181Q165 141 145 126Z" fill="url(#suit)" stroke="#b8e2ff" stroke-width="3"/><rect x="82" y="151" width="56" height="43" rx="10" fill="#173b68" stroke="#5edaff" stroke-width="3"/><path d="M94 164h32M94 174h20M94 184h27" stroke="#66dcff" stroke-width="3" stroke-linecap="round"/><path d="M69 65Q72 23 110 22Q148 23 151 65L145 111Q139 135 110 139Q81 135 75 111Z" fill="url(#suit)" stroke="#b8e2ff" stroke-width="4"/><rect x="77" y="53" width="66" height="53" rx="23" fill="url(#visor)" stroke="#55caff" stroke-width="4"/><path d="M90 67Q107 55 126 65" stroke="#6ddfff" stroke-width="4" fill="none" opacity=".7"/><circle cx="65" cy="83" r="8" fill="#5bdcff"/><circle cx="155" cy="83" r="8" fill="#5bdcff"/><path d="M84 122L73 137M136 122L147 137" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M80 215l-7 16h35l2-15M140 215l7 16h-35l-2-15" fill="#d8eaff" stroke="#7dcaff" stroke-width="3"/></svg></div></div>
<div class="wrap"><header class="top"><div class="brand"><div class="mark">✦</div><div>SOSKS5<small>ADMIN CONTROL CENTER</small></div></div><span class="pill">● SECURE UI PREVIEW</span></header>
<section id="login" class="login"><form id="loginForm" class="login-card"><h1>欢迎回来</h1><p>登录管理面板，管理节点、用户、库存与机器人。</p><label class="field"><span>管理员邮箱</span><input id="email" type="email" placeholder="admin@example.com" required></label><label class="field"><span>访问口令</span><input id="password" type="password" placeholder="输入访问口令" required></label><button class="btn primary" type="submit">进入控制台 →</button><div class="hint">安全提示：此静态预览不验证口令，不会授予真实后台权限。请先连接服务端认证。</div></form></section>
<section id="dashboard" class="hidden"><div class="layout"><aside class="side"><div class="side-label">WORKSPACE</div><button class="nav active" data-page="overview"><span>▦</span>总览</button><button class="nav" data-page="inventory"><span>▤</span>库存管理</button><button class="nav" data-page="users"><span>♙</span>用户管理</button><button class="nav" data-page="nodes"><span>⌘</span>节点管理</button><button class="nav" data-page="bots"><span>◉</span>机器人</button><button class="nav" data-page="settings"><span>⚙</span>系统设置</button><button id="logout" class="nav"><span>↪</span>退出</button></aside><main class="main"><div class="heading"><div><h1 id="pageTitle">系统总览</h1><p id="pageDesc">实时管理概况 · 尚未连接真实 API</p></div><span class="pill">PREVIEW MODE</span></div><div id="content"></div></main></div></section></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const titles={overview:"系统总览",inventory:"库存管理",users:"用户管理",nodes:"节点管理",bots:"机器人管理",settings:"系统设置"};let page="overview";
function toast(s){const t=$("#toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2300)}
function render(p){page=p;$("#pageTitle").textContent=titles[p];$("#pageDesc").textContent=p==="inventory"?"账号库存、销售状态与买家信息 · 等待后端 API":"管理概况 · 尚未连接真实 API";document.querySelectorAll(".nav[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));const c=$("#content");
if(p==="overview"){c.innerHTML='<div class="grid"><div class="card"><div class="metric-label">总用户数</div><div class="metric">—</div><div class="note">等待真实 API</div></div><div class="card"><div class="metric-label">在线用户</div><div class="metric">—</div><div class="note">未连接节点</div></div><div class="card"><div class="metric-label">本周期流量</div><div class="metric">—</div><div class="note">等待统计接口</div></div><div class="card"><div class="metric-label">运行节点</div><div class="metric">—</div><div class="note">等待节点 API</div></div></div><div class="cols"><div class="card"><h3>系统活动</h3><div class="empty">接入后端后显示真实事件与审计记录。</div></div><div class="card"><h3>服务状态</h3><div class="bars"><div><div class="barlabel"><span>用户 API</span><span>未连接</span></div><div class="bar"><span style="width:0%"></span></div></div><div><div class="barlabel"><span>节点 API</span><span>未连接</span></div><div class="bar"><span style="width:0%"></span></div></div></div></div></div>'}
else if(p==="inventory"){c.innerHTML='<div class="grid"><div class="card"><div class="metric-label">库存总量</div><div class="metric">—</div><div class="note">等待 API 数据</div></div><div class="card"><div class="metric-label">可用账号</div><div class="metric">—</div><div class="note">等待 API 数据</div></div><div class="card"><div class="metric-label">已售账号</div><div class="metric">—</div><div class="note">等待 API 数据</div></div><div class="card"><div class="metric-label">买家资料</div><div class="metric">关联查询</div><div class="note">orders → users</div></div></div><div class="card tablecard"><div class="tablehead"><h3>账号库存</h3><button id="refreshInventory" class="btn">↻ 刷新</button></div><div class="tablewrap"><table><thead><tr><th>库存 ID</th><th>Session ID</th><th>状态</th><th>订单 ID</th><th>买家</th></tr></thead><tbody><tr><td colspan="5"><div class="empty">等待连接 /api/admin/inventory。连接后显示真实记录、买家昵称与头像。</div></td></tr></tbody></table></div></div>';$("#refreshInventory").onclick=()=>toast("未配置 API 地址，当前不请求或伪造数据")}
else{const names={users:["用户管理","管理用户与流量配额"],nodes:["节点管理","查看节点健康与连接状态"],bots:["机器人管理","管理获授权连接的机器人"],settings:["系统设置","认证、API 地址与安全配置"]};c.innerHTML='<div class="card"><h3>'+names[p][0]+'</h3><p style="color:#8ca9ce;line-height:1.8">'+names[p][1]+'</p><div class="empty">此模块等待服务端 API 接入。页面不会显示伪造的在线状态，也不会在前端保存密钥。</div></div>'}}
$("#loginForm").addEventListener("submit",e=>{e.preventDefault();sessionStorage.setItem("uiPreview","1");$("#login").classList.add("hidden");$("#dashboard").classList.remove("hidden");render("overview");toast("已进入静态预览；服务端认证尚未连接")});
document.querySelectorAll(".nav[data-page]").forEach(b=>b.addEventListener("click",()=>{if(!sessionStorage.getItem("uiPreview")){toast("请先登录预览");return}render(b.dataset.page)}));
$("#logout").addEventListener("click",()=>{sessionStorage.removeItem("uiPreview");$("#dashboard").classList.add("hidden");$("#login").classList.remove("hidden")});
if(sessionStorage.getItem("uiPreview")){$("#login").classList.add("hidden");$("#dashboard").classList.remove("hidden");render("overview")}else render("overview");
</script></body></html>

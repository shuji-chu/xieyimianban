<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061329"><title>SOSKS5 · Admin Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{color-scheme:dark;--bg:#061329;--panel:rgba(10,29,58,.88);--line:#1e416d;--text:#e5f2ff;--muted:#8ca9ce;--cyan:#5de1ff;--blue:#398bff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#123d72 0,transparent 42%),linear-gradient(145deg,#050b19,#071a35 55%,#030914);font:14px Inter,system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--text);min-height:100vh}button{font:inherit;cursor:pointer}.space{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 20%,#fff 55%,transparent 70%),radial-gradient(1px 1px at 70% 12%,#b9e7ff 55%,transparent 70%),radial-gradient(2px 2px at 84% 62%,#fff 55%,transparent 70%);background-size:290px 250px;animation:stars 28s linear infinite}.planet{position:absolute;width:100px;height:100px;left:10%;top:14%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#8ee8ff,#2879db 38%,#10275e 75%);box-shadow:inset -14px -10px 24px #020c2c,0 0 48px #288dff55}.astronaut{position:absolute;width:clamp(130px,19vw,220px);right:6%;top:4%;opacity:.72;filter:drop-shadow(0 15px 35px #168bff55);animation:float 5s ease-in-out infinite}.wrap{max-width:1450px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 22px;border-bottom:1px solid #1e416d88}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#4bc3ff,#2765e9);box-shadow:0 0 28px #368cff44}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.2em;margin-top:3px}.pill{border:1px solid #285583;background:#0a2444;color:#7de8ce;border-radius:30px;padding:8px 12px;font-size:11px}.layout{display:grid;grid-template-columns:200px 1fr;gap:22px;margin-top:22px}.side,.card{background:var(--panel);border:1px solid #23456b;border-radius:18px;backdrop-filter:blur(18px);box-shadow:0 20px 65px #0003}.side{padding:12px;height:max-content;position:sticky;top:16px}.side-label{font-size:10px;color:#6f91bb;letter-spacing:.18em;padding:12px}.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#91acd0;text-align:left;padding:13px 12px;border-radius:11px;margin:3px 0}.nav.active,.nav:hover{background:#10345d;color:#76dfff}.main{min-width:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 20px}.heading h1{font-size:25px;margin:0;letter-spacing:-.04em}.heading p{color:var(--muted);font-size:12px;margin:7px 0 0}.btn{border:1px solid #2d5a8a;background:#102f59;color:#9edbff;border-radius:10px;padding:10px 14px}.btn.primary{background:linear-gradient(110deg,#2389ee,#315eea);border:0;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{padding:18px;min-width:0}.metric-label{color:#91acd0;font-size:11px}.metric{font-size:25px;font-weight:800;margin:13px 0 6px}.note{color:#6e91bb;font-size:10px}.tablecard{padding:0;margin-top:14px}.tablehead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.tablehead h3{margin:0}table{border-collapse:collapse;width:100%;min-width:550px}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid #1b3658;font-size:11px;max-width:320px;overflow-wrap:anywhere}th{color:#7899c2;background:#091e3a}td{color:#b0c7e5}.tablewrap{overflow:auto}.empty{padding:34px 12px;text-align:center;color:#8ca9ce;line-height:1.7}.status{padding:5px 8px;border-radius:20px;color:#73e8c7;background:#103b3b;font-size:10px}.status.warn{color:#ffd27a;background:#48351a}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#123761;border:1px solid #3573a9;border-radius:12px;display:none;z-index:99;max-width:90vw}.mapbox{height:380px;border-radius:12px;overflow:hidden;border:1px solid #23456b;background:#071a35}.leaflet-container{background:#071a35}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#102f59;color:#e5f2ff}.muted{color:var(--muted)}.error{color:#ffc078}.success{color:#7de8ce}.hidden{display:none!important}@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-13px) rotate(3deg)}}@keyframes stars{to{background-position:290px 250px,-190px 160px,130px -200px}}@media(max-width:850px){.layout{grid-template-columns:70px 1fr}.side{padding:8px}.nav{justify-content:center;font-size:0}.nav span{font-size:17px}.side-label{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.astronaut{opacity:.3}}@media(max-width:560px){.wrap{padding:14px}.layout{grid-template-columns:1fr;gap:12px}.side{position:static;display:flex;overflow:auto;gap:4px}.nav{flex:1;min-width:42px;padding:12px 8px}.grid{gap:8px}.card{padding:13px}.heading h1{font-size:21px}.astronaut{width:95px;right:2%;top:8%;opacity:.25}.mapbox{height:310px}.top{padding-bottom:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style></head>
<body>
<div class="space"><div class="stars"></div><div class="planet"></div><div class="astronaut" aria-hidden="true"><svg viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#91b8e9"/></linearGradient><linearGradient id="visor"><stop stop-color="#174d8b"/><stop offset="1" stop-color="#07152f"/></linearGradient></defs><ellipse cx="110" cy="225" rx="60" ry="10" fill="#248aff" opacity=".2"/><path d="M73 136Q47 142 40 177L28 200Q27 211 39 212L55 184 76 167M147 136Q173 142 180 177L192 200Q193 211 181 212L165 184 144 167" fill="url(#suit)" stroke="#9edbff" stroke-width="3"/><path d="M75 126Q55 141 61 181L71 216Q110 237 149 216L159 181Q165 141 145 126Z" fill="url(#suit)" stroke="#b8e2ff" stroke-width="3"/><rect x="82" y="151" width="56" height="43" rx="10" fill="#173b68" stroke="#5edaff" stroke-width="3"/><path d="M94 164h32M94 174h20M94 184h27" stroke="#66dcff" stroke-width="3" stroke-linecap="round"/><path d="M69 65Q72 23 110 22Q148 23 151 65L145 111Q139 135 110 139Q81 135 75 111Z" fill="url(#suit)" stroke="#b8e2ff" stroke-width="4"/><rect x="77" y="53" width="66" height="53" rx="23" fill="url(#visor)" stroke="#55caff" stroke-width="4"/><path d="M90 67Q107 55 126 65" stroke="#6ddfff" stroke-width="4" fill="none" opacity=".7"/><circle cx="65" cy="83" r="8" fill="#5bdcff"/><circle cx="155" cy="83" r="8" fill="#5bdcff"/></svg></div></div>
<div class="wrap"><header class="top"><div class="brand"><div class="mark">✦</div><div>SOSKS5<small>ADMIN CONTROL CENTER</small></div></div><span class="pill" id="apiStatus">● API 正在检查</span></header>
<div class="layout"><aside class="side"><div class="side-label">WORKSPACE</div><button class="nav active" data-page="map"><span>⌖</span>IP 地图</button><button class="nav" data-page="products"><span>▤</span>商品管理</button><button class="nav" data-page="orders"><span>▣</span>订单管理</button><button class="nav" data-page="inventory"><span>▥</span>库存管理</button><button class="nav" data-page="settings"><span>⚙</span>接口状态</button></aside><main class="main"><div class="heading"><div><h1 id="pageTitle">IP 地图</h1><p id="pageDesc">真实接口 · https://api.lynli.me</p></div><button class="btn primary" id="refresh">↻ 刷新数据</button></div><div id="content"></div></main></div></div><div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
"use strict";
const API_BASE="https://api.lynli.me";
const ENDPOINTS={map:"/api/v1/geek/ip",products:"/api/v1/admin/shop/products",orders:"/api/v1/admin/shop/orders",inventory:"/api/admin/inventory"};
const $=s=>document.querySelector(s);let page="map",mapInstance=null,mapMarker=null;
const titles={map:"IP 地图",products:"商品管理",orders:"订单管理",inventory:"库存管理",settings:"接口状态"};
function toast(s){const t=$("#toast");t.textContent=s;t.style.display="block";clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display="none",3500)}
function esc(v){return String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch(API_BASE+path,{method:"GET",headers:{Accept:"application/json"},mode:"cors",signal:controller.signal,cache:"no-store"});const raw=await r.text();let body;try{body=raw?JSON.parse(raw):{}}catch{throw new Error("接口返回的不是 JSON（HTTP "+r.status+"）")}if(!r.ok)throw new Error("HTTP "+r.status+" "+(body.message||body.detail||r.statusText));if(body&&Object.prototype.hasOwnProperty.call(body,"code")){if(Number(body.code)!==1)throw new Error(body.message||body.msg||("业务 code="+body.code));return body.data}return body.data??body}finally{clearTimeout(timer)}}
function showError(err){const msg=err?.name==="AbortError"?"请求超时（12 秒）":(err?.message||String(err));return '<div class="empty error">请求失败：'+esc(msg)+'<br>请检查 API 服务、CORS、鉴权及 Nginx 反向代理。</div>'}
function asArray(d){if(Array.isArray(d))return d;if(!d||typeof d!=="object")return [];for(const k of ["items","results","list","records","products","orders","data"])if(Array.isArray(d[k]))return d[k];return []}
function tableHTML(rows){if(!rows.length)return '<div class="empty">接口请求成功，但 data 中没有可显示的列表记录。</div>';const keys=[...new Set(rows.slice(0,30).flatMap(o=>o&&typeof o==="object"?Object.keys(o):[]))].slice(0,8);if(!keys.length)return '<div class="empty">接口返回的数据不是对象列表。</div>';return '<div class="tablewrap"><table><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join("")+'</tr></thead><tbody>'+rows.slice(0,200).map(o=>'<tr>'+keys.map(k=>{let v=o?.[k];if(v&&typeof v==="object")v=JSON.stringify(v);if(typeof v==="string"&&v.length>500)v=v.slice(0,500)+"…";return '<td>'+esc(v)+'</td>'}).join("")+'</tr>').join("")+'</tbody></table></div>'}
function setStatus(text,ok){$("#apiStatus").textContent=(ok?"● ":"● ")+text;$("#apiStatus").style.color=ok?"#7de8ce":"#ffc078"}
function renderShell(p){page=p;$("#pageTitle").textContent=titles[p];$("#pageDesc").textContent="API BaseURL: "+API_BASE;document.querySelectorAll(".nav[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("#content").innerHTML='<div class="card"><div class="empty">正在请求真实后端…</div></div>'}
async function renderMap(){renderShell("map");$("#content").innerHTML='<div class="grid"><div class="card"><div class="metric-label">城市</div><div class="metric" id="city">加载中…</div><div class="note">data.city</div></div><div class="card"><div class="metric-label">ISP</div><div class="metric" id="isp" style="font-size:18px">加载中…</div><div class="note">data.isp</div></div><div class="card"><div class="metric-label">坐标</div><div class="metric" id="coords" style="font-size:16px">加载中…</div><div class="note">data.lat / data.lon</div></div></div><div class="card" style="margin-top:14px"><div class="mapbox" id="map"></div><div class="note" id="mapNote" style="margin-top:12px">来源：/api/v1/geek/ip</div></div>';if(!window.L){$("#mapNote").innerHTML='<span class="error">地图组件加载失败，请检查 unpkg.com 访问。</span>';return}if(!mapInstance){mapInstance=L.map("map").setView([20,0],2);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(mapInstance)}try{const d=await api(ENDPOINTS.map);const lat=Number(d?.lat),lon=Number(d?.lon);$("#city").textContent=d?.city??"未知";$("#isp").textContent=d?.isp??"未知";$("#coords").textContent=Number.isFinite(lat)&&Number.isFinite(lon)?lat.toFixed(5)+", "+lon.toFixed(5):"坐标缺失";if(Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=-90&&lat<=90&&lon>=-180&&lon<=180){mapInstance.setView([lat,lon],9);if(mapMarker)mapMarker.remove();mapMarker=L.marker([lat,lon]).addTo(mapInstance).bindPopup("<b>"+esc(d.city||"IP 位置")+"</b><br>"+esc(d.isp||"")+'<br>'+lat+', '+lon).openPopup();$("#mapNote").textContent="定位数据已载入 · isIP="+esc(d.isp||"—")+" · data.isp / data.city"}else $("#mapNote").innerHTML='<span class="error">接口成功，但 data.lat / data.lon 缺失或无效。</span>';setTimeout(()=>mapInstance.invalidateSize(),100);setStatus("地图接口已连接",true)}catch(e){$("#mapNote").innerHTML=showError(e);setStatus("API 连接异常",false)}}
async function renderList(p){renderShell(p);try{const d=await api(ENDPOINTS[p]);const rows=asArray(d);$("#content").innerHTML='<div class="grid"><div class="card"><div class="metric-label">'+(p==="products"?"商品记录数":"订单记录数")+'</div><div class="metric">'+rows.length+'</div><div class="note">来自真实接口 · '+esc(ENDPOINTS[p])+'</div></div><div class="card"><div class="metric-label">响应状态</div><div class="metric success" style="font-size:20px">成功</div><div class="note">旧格式 code=1 已适配</div></div><div class="card"><div class="metric-label">展示条数</div><div class="metric">'+Math.min(rows.length,200)+'</div><div class="note">最多展示 200 条</div></div></div><div class="card tablecard"><div class="tablehead"><h3>'+(p==="products"?"商品列表":"订单列表")+'</h3><button class="btn" id="reloadList">↻ 重新请求</button></div>'+tableHTML(rows)+'</div>';$("#reloadList").onclick=()=>renderList(p);setStatus("商品/订单 API 已响应",true)}catch(e){$("#content").innerHTML='<div class="card">'+showError(e)+'</div>';setStatus("API 请求失败",false)}}
async function renderInventory(){renderShell("inventory");try{const d=await api(ENDPOINTS.inventory);const rows=asArray(d);$("#content").innerHTML='<div class="card"><div class="metric-label">库存记录数</div><div class="metric">'+rows.length+'</div><div class="note">真实接口：'+esc(ENDPOINTS.inventory)+'</div></div><div class="card tablecard"><div class="tablehead"><h3>库存记录</h3><button class="btn" id="reloadInv">↻ 刷新</button></div>'+tableHTML(rows)+'</div>';$("#reloadInv").onclick=renderInventory;setStatus("库存 API 已连接",true)}catch(e){const msg=e?.message||String(e);$("#content").innerHTML='<div class="card"><div class="empty error"><b>库存接口暂不可用</b><br>'+esc(msg)+'<br><br>请确认 API 网关/Nginx 已将 <code>/api/admin/inventory</code> 转发到运行在 8001 端口的 FastAPI 服务，并允许来自 GitHub Pages 的 CORS 请求。<br>按你的要求，地图、商品和订单仍可独立使用。</div></div>';setStatus("库存接口不可用",false)}}
async function renderSettings(){renderShell("settings");$("#content").innerHTML='<div class="card"><h3>API 配置</h3><p>BaseURL：<code>'+API_BASE+'</code></p>'+Object.entries(ENDPOINTS).map(([k,v])=>'<p><span class="muted">'+esc(titles[k])+'：</span><code>'+esc(v)+'</code></p>').join("")+'<p class="muted">兼容响应格式：{ "code": 1, "data": ... }。如果响应包含 code，只有 code=1 会视为成功；同时兼容直接返回 data 的响应。</p><p class="muted">本页当前使用 GET 请求，不会在浏览器内硬编码或保存管理密钥。</p></div>'}
async function render(p){if(p==="map")return renderMap();if(p==="products"||p==="orders")return renderList(p);if(p==="inventory")return renderInventory();return renderSettings()}
document.querySelectorAll(".nav[data-page]").forEach(b=>b.addEventListener("click",()=>render(b.dataset.page)));$("#refresh").addEventListener("click",()=>render(page));render("map");
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030914">
<title>SOSKS5 · 控制台</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e6f3ff;background:radial-gradient(ellipse at 20% 0%,#102e52 0,transparent 45%),radial-gradient(ellipse at 90% 100%,#0b2545 0,transparent 40%),#030914;display:grid;place-items:center;padding:24px}.panel{width:min(620px,100%);border:1px solid #244d75;border-radius:24px;background:rgba(5,19,40,.84);padding:clamp(24px,6vw,44px);box-shadow:0 28px 90px #0008,0 0 55px #2289ff12}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:2px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#1678d4,#48d7f5);color:#031226;font-size:22px}.eyebrow{margin-top:32px;color:#5de1ff;font-size:11px;letter-spacing:2px}h1{font-size:clamp(28px,6vw,40px);margin:12px 0;color:#f0f8ff}p{line-height:1.8;color:#96b2d5}.status{margin-top:26px;padding:16px;border:1px solid #244d75;border-radius:14px;background:#081d35;color:#9cc5e8;font-size:13px;overflow-wrap:anywhere}.status strong{color:#67e5bd}.btn{display:inline-block;margin-top:22px;padding:12px 18px;border-radius:10px;text-decoration:none;color:#031226;font-weight:800;background:linear-gradient(100deg,#62d6ff,#65f0c4)}
</style>
</head>
<body><main class="panel"><div class="brand"><div class="mark">✦</div><div>SOSKS5<div style="font-size:10px;font-weight:500;color:#87a8ce;letter-spacing:1.5px;margin-top:4px">NODE CONTROL SYSTEM</div></div></div><div class="eyebrow">AUTHENTICATED WORKSPACE</div><h1>欢迎进入控制台</h1><p>邮箱验证码认证已完成。这里是控制台占位页面，后续可以继续接入真实的用户、节点和流量 API。</p><div class="status" id="sessionStatus">正在检查登录状态…</div><a class="btn" href="/xieyimianban/">返回登录页</a></main>
<script>
(function(){const token=localStorage.getItem('access_token');const el=document.getElementById('sessionStatus');if(token){el.innerHTML='<strong>● 已保存登录令牌</strong><br>Token 已保存在当前浏览器的 localStorage 中。请勿在公共设备上保留登录状态。'}else{el.textContent='未找到登录令牌。请先返回登录页完成邮箱验证码验证。'}})();
</script></body></html>

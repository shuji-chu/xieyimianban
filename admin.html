<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f">
<title>SOSKS5 · 管理控制台</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--panel2:#102239;--line:#203850;--text:#e8f1fb;--muted:#8ea5bd;--blue:#56b7ff;--green:#4adea5;--red:#ff7887}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 8% -10%,#16375b 0,transparent 40%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}.topbar{height:70px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);background:#07111fe8;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:1.5px}.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#1683e3,#4ce0ed);color:#061326;font-size:21px}.brand small{display:block;margin-top:3px;color:#8ca7c5;font-size:9px;letter-spacing:1.3px;font-weight:500}
.account{display:flex;align-items:center;gap:14px;min-width:0}.email{font-size:13px;color:#b8cce0;max-width:min(38vw,360px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logout{border:1px solid #36516c;border-radius:9px;padding:8px 13px;color:#d7e6f5;background:#102137;font-size:12px}.logout:hover{border-color:#ff7887;color:#ff9ca7}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 70px)}.sidebar{border-right:1px solid var(--line);padding:24px 14px;background:#091625a8}.nav-label{padding:0 12px 12px;color:#627f9e;font-size:10px;letter-spacing:1.8px}.nav-btn{width:100%;display:flex;align-items:center;gap:12px;border:1px solid transparent;background:transparent;color:#9ab0c8;text-align:left;padding:13px 12px;border-radius:11px;margin-bottom:6px;font-size:13px}.nav-btn .ico{width:24px;text-align:center;font-size:17px}.nav-btn.active{color:#e8f6ff;border-color:#234d70;background:linear-gradient(100deg,#153b60,#10243b);box-shadow:inset 3px 0 #56b7ff}.nav-btn:hover:not(.active){background:#102137;color:#e3effc}
main{min-width:0;padding:clamp(20px,3vw,38px)}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}.eyebrow{font-size:10px;color:var(--blue);letter-spacing:2px;font-weight:800}.page-head h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.7px;margin:8px 0 6px}.page-head p{margin:0;color:var(--muted);font-size:13px}.refresh{border:1px solid #2c4d69;background:#10243a;color:#cfe7ff;border-radius:10px;padding:10px 14px;font-size:12px;white-space:nowrap}.refresh:disabled{opacity:.5;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#10243a,#0a1727);padding:18px 20px;min-width:0}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:27px;font-weight:800;margin-top:10px;letter-spacing:-.5px}.stat-value.blue{color:#8ad1ff}.stat-value.green{color:var(--green)}.stat-value.orange{color:#ffc878}
.table-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0a1727d9}.table-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}.table-title strong{font-size:14px}.table-title span{font-size:11px;color:var(--muted)}.table-wrap{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;min-width:700px;text-align:left}thead{background:#0e2034}th{font-size:11px;letter-spacing:.3px;font-weight:650;color:#8faac5;padding:14px 20px;white-space:nowrap}td{padding:14px 20px;border-top:1px solid #1a3046;font-size:12px;color:#c8d8e8}tbody tr:hover{background:#10223866}.account-cell{font-weight:650;color:#e3f0fc;overflow-wrap:anywhere}.status-pill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700;white-space:nowrap}.status-pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status-pill.available{color:#55e2a7;background:#123b32}.status-pill.sold{color:#ff9ca7;background:#3b202b}.status-pill.unknown{color:#a8bed3;background:#1c2c3d}.buyer{display:flex;align-items:center;gap:10px;min-width:160px}.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#1c3854;border:1px solid #31516d;flex-shrink:0}.avatar-fallback{display:grid;place-items:center;color:#9cc9ed;font-size:13px;font-weight:800}.buyer-name{color:#e0edf9;font-size:12px;font-weight:650;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.buyer-id{color:#7994b1;font-size:10px;margin-top:4px;overflow-wrap:anywhere}.empty,.error-state,.loading-wrap{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px}.error-state{color:#ff9ca7}.error-state p{margin:0 0 8px}.skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,#14283c 25%,#213b54 45%,#14283c 65%);background-size:220% 100%;animation:shimmer 1.25s infinite}.skeleton-row td{padding-top:18px;padding-bottom:18px}.skeleton-wide{width:min(240px,100%)}.skeleton-mid{width:100px}.skeleton-small{width:64px}@keyframes shimmer{to{background-position:-220% 0}}.hidden{display:none!important}.notice{margin-top:13px;color:#708ba7;font-size:11px;line-height:1.7}.node-placeholder{border:1px solid var(--line);border-radius:16px;background:#0a1727;padding:34px;color:var(--muted);font-size:13px;line-height:1.8}.node-placeholder strong{color:#e8f1fb}
@media(max-width:760px){.topbar{padding:0 15px;height:62px}.brand{font-size:13px}.mark{width:32px;height:32px}.account{gap:8px}.email{max-width:36vw;font-size:11px}.logout{padding:7px 9px}.shell{grid-template-columns:1fr;min-height:calc(100vh - 62px)}.sidebar{display:flex;align-items:center;gap:8px;padding:10px 13px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}.nav-label{display:none}.nav-btn{width:auto;white-space:nowrap;margin:0;padding:10px 12px}.nav-btn .ico{width:auto}main{padding:20px 13px}.stats{gap:8px}.stat{padding:13px 12px}.stat-label{font-size:10px}.stat-value{font-size:23px}.page-head{align-items:flex-start}.page-head p{max-width:250px;line-height:1.6}.refresh{padding:9px 10px}.table-title{padding:15px}.table-title span{max-width:45%;text-align:right;line-height:1.5}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="mark">✦</div><div>SOSKS5<small>ADMIN CONTROL CENTER</small></div></div><div class="account"><span class="email" id="accountEmail">正在读取账户…</span><button class="logout" id="logoutBtn" type="button">退出登录 ↗</button></div></header>
<div class="shell">
<aside class="sidebar" aria-label="主导航"><div class="nav-label">工作空间</div><button class="nav-btn active" data-page="inventory" type="button"><span class="ico">▤</span>库存管理</button><button class="nav-btn" data-page="nodes" type="button"><span class="ico">⌘</span>节点监控</button></aside>
<main>
<section id="inventoryPage">
<div class="page-head"><div><div class="eyebrow">INVENTORY / OVERVIEW</div><h1>库存管理</h1><p>实时读取服务端库存与归属信息。</p></div><button class="refresh" id="refreshBtn" type="button">↻ 刷新数据</button></div>
<div class="stats">
<div class="stat"><div class="stat-label">库存总量</div><div class="stat-value blue" id="totalCount">—</div></div>
<div class="stat"><div class="stat-label">可售数量</div><div class="stat-value green" id="availableCount">—</div></div>
<div class="stat"><div class="stat-label">已售数量</div><div class="stat-value orange" id="soldCount">—</div></div>
</div>
<div class="table-card"><div class="table-title"><strong>库存明细</strong><span id="tableMeta">等待服务端响应</span></div><div class="table-wrap"><table><thead><tr><th>邮箱账号</th><th>状态</th><th>归属者</th></tr></thead><tbody id="inventoryBody"><tr><td colspan="3"><div class="loading-wrap">正在连接库存 API…</div></td></tr></tbody></table></div></div>
<p class="notice">数据直接来自服务器接口；此页面不会生成或填充模拟库存。</p>
</section>
<section id="nodesPage" class="hidden"><div class="page-head"><div><div class="eyebrow">NODES / MONITORING</div><h1>节点监控</h1><p>节点数据尚未接入当前页面。</p></div></div><div class="node-placeholder"><strong>节点监控 API 尚未配置</strong><br>当前只展示真实库存接口返回的数据。配置节点接口后，才能展示在线状态、延迟与流量等监控指标。</div></section>
</main>
</div>
<script>
(function(){
'use strict';
const API='https://api.lynli.me/api/admin/inventory';
const LOGIN_URL='/xieyimianban/';
const $=s=>document.querySelector(s);
const body=$('#inventoryBody'),refreshBtn=$('#refreshBtn'),tableMeta=$('#tableMeta');
let loading=false;
function getToken(){return localStorage.getItem('access_token')||sessionStorage.getItem('access_token')}
function parseJwtEmail(token){
 try{const part=token.split('.')[1];if(!part)return '';const b64=part.replace(/-/g,'+').replace(/_/g,'/');const json=decodeURIComponent(Array.from(atob(b64),c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join(''));const p=JSON.parse(json);return p.email||p.sub||''}catch(_){return ''}
}
function clearAuthAndRedirect(){localStorage.removeItem('access_token');sessionStorage.removeItem('access_token');localStorage.removeItem('remembered_email');window.location.replace(LOGIN_URL)}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showSkeleton(){
 body.innerHTML=Array.from({length:7},()=>'<tr class="skeleton-row"><td><div class="skeleton skeleton-wide"></div></td><td><div class="skeleton skeleton-small"></div></td><td><div class="skeleton skeleton-mid"></div></td></tr>').join('');
 tableMeta.textContent='正在加载…';$('#totalCount').textContent='…';$('#availableCount').textContent='…';$('#soldCount').textContent='…';
}
function getInventoryArray(payload){
 if(Array.isArray(payload))return payload;
 for(const path of ['items','inventory','results','data','records']){
  const value=payload&&payload[path];if(Array.isArray(value))return value;
  if(value&&typeof value==='object'){for(const nested of ['items','inventory','results','records'])if(Array.isArray(value[nested]))return value[nested]}
 }
 return null;
}
function statusFor(item){
 const raw=String(item.status??item.state??'').toLowerCase();
 if(raw==='sold')return {label:'已售',className:'sold'};
 if(raw==='available')return {label:'可售',className:'available'};
 return {label:raw?String(item.status??item.state):'未知',className:'unknown'};
}
function buyerMarkup(buyer){
 if(!buyer||typeof buyer!=='object')return '<span>—</span>';
 const name=buyer.nickname??buyer.name??buyer.username??'未命名用户';
 const id=buyer.id??buyer.user_id??buyer.uid;
 const avatar=buyer.avatar_url??buyer.avatar??buyer.photo_url??buyer.photo;
 const initial=String(name).trim().charAt(0)||'？';
 const image=avatar?'<img class="avatar" src="'+escapeHtml(avatar)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">':'<span class="avatar avatar-fallback">'+escapeHtml(initial)+'</span>';
 return '<div class="buyer">'+image+'<div><div class="buyer-name">'+escapeHtml(name)+'</div><div class="buyer-id">'+(id!==undefined&&id!==null?'ID: '+escapeHtml(id):'ID: —')+'</div></div></div>';
}
function renderInventory(items){
 const available=items.filter(x=>String(x.status??x.state??'').toLowerCase()==='available').length;
 const sold=items.filter(x=>String(x.status??x.state??'').toLowerCase()==='sold').length;
 $('#totalCount').textContent=items.length.toLocaleString('zh-CN');$('#availableCount').textContent=available.toLocaleString('zh-CN');$('#soldCount').textContent=sold.toLocaleString('zh-CN');
 tableMeta.textContent='服务端返回 '+items.length.toLocaleString('zh-CN')+' 条记录';
 if(!items.length){body.innerHTML='<tr><td colspan="3"><div class="empty">接口返回了空库存，没有可展示的记录。</div></td></tr>';return}
 body.innerHTML=items.map(item=>{
  const email=item.email??item.email_account??item.account??item.emailAddress??'';
  const status=statusFor(item);const buyer=item.buyer??item.owner??null;
  return '<tr><td class="account-cell">'+(email?escapeHtml(email):'—')+'</td><td><span class="status-pill '+status.className+'">'+escapeHtml(status.label)+'</span></td><td>'+buyerMarkup(buyer)+'</td></tr>';
 }).join('');
}
async function loadInventory(){
 if(loading)return;const token=getToken();if(!token){clearAuthAndRedirect();return}
 loading=true;refreshBtn.disabled=true;refreshBtn.textContent='加载中…';showSkeleton();
 try{
  const response=await fetch(API,{method:'GET',headers:{'Accept':'application/json','Authorization':'Bearer '+token}});
  if(response.status===401){clearAuthAndRedirect();return}
  if(!response.ok)throw new Error('库存接口请求失败（HTTP '+response.status+'）');
  let data;try{data=await response.json()}catch(_){throw new Error('服务器返回的内容不是有效 JSON')}
  const items=getInventoryArray(data);
  if(!items)throw new Error('接口响应中未找到库存数组，请核对 API 返回结构');
  renderInventory(items);
 }catch(error){
  // Any API failure invalidates the local view and returns to the login page as requested.
  clearAuthAndRedirect();
 }finally{loading=false;refreshBtn.disabled=false;refreshBtn.textContent='↻ 刷新数据'}
}
$('#accountEmail').textContent=localStorage.getItem('remembered_email')||parseJwtEmail(getToken())||'已登录账户';
$('#logoutBtn').addEventListener('click',clearAuthAndRedirect);
refreshBtn.addEventListener('click',loadInventory);
document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x===btn));
 const inventory=btn.dataset.page==='inventory';$('#inventoryPage').classList.toggle('hidden',!inventory);$('#nodesPage').classList.toggle('hidden',inventory);
 if(inventory)loadInventory();
}));
if(!getToken())clearAuthAndRedirect();else loadInventory();
})();
</script>
</body></html>
